---
name: Build Salt Extension Python Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Python Packages (wheel and sdist)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --requirement tools/requirements-release.txt --user

      - name: Build wheel and source distribution
        run: python -m build --outdir dist/

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Check distribution contents
        run: |
          python -m check_wheel_contents dist/*.whl
          python tools/check_dist.py dist

      - name: Verify source distribution can build a wheel
        env:
          SDIST_WHEEL_DIR: ${{ runner.temp }}/from-sdist
        run: >-
          python -m pip wheel
          --no-deps
          --wheel-dir "$SDIST_WHEEL_DIR"
          dist/*.tar.gz

      - name: Verify wheel installation outside the source tree
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m venv wheel-install
          wheel-install/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-install/bin/python -m pip check
          wheel-install/bin/python - <<'PY'
          from importlib.metadata import distribution

          dist = distribution("saltext.ceph")
          entry = next(
              item
              for item in dist.entry_points
              if item.group == "salt.loader" and item.name == "saltext.ceph"
          )
          package = entry.load()
          assert package.__version__ == dist.version
          requirements = [item.lower() for item in (dist.requires or ())]
          assert any(item.startswith("salt") for item in requirements)
          assert any(item.startswith("requests") for item in requirements)
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: salt-extension-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
