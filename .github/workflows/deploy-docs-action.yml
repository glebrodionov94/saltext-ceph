---
name: Publish Documentation

on:  # zizmor: ignore[dangerous-triggers] restricted to validated same-repository release runs
  workflow_run:
    types:
      - completed
    workflows:
      - Auto PR Releases
      - Tagged Releases

permissions: {}

concurrency:
  group: saltext-ceph-docs-release
  cancel-in-progress: false

jobs:
  deploy_docs:
    name: Publish Docs to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      vars.CEPH_RELEASES_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        (github.event.workflow_run.name == 'Tagged Releases' &&
         github.event.workflow_run.event == 'push') ||
        (github.event.workflow_run.name == 'Auto PR Releases' &&
         github.event.workflow_run.event == 'pull_request')
      )
    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download documentation from the successful release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: html-docs
          path: html-docs
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          name: html-docs-pages
          path: html-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        with:
          artifact_name: html-docs-pages
