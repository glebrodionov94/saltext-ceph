---
name: Testing

on:
  workflow_call:

permissions: {}

jobs:

  Linux:
    name: Linux / Python ${{ matrix.python-version }} / Salt ${{ matrix.salt-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Codecov uses GitHub OIDC instead of a repository token.

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {salt-version: "3006.27", python-version: "3.10"}
          - {salt-version: "3006.27", python-version: "3.11"}
          - {salt-version: "3008.2", python-version: "3.14"}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2  # coverage: Issue detecting commit SHA
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nox
        run: |
          python -m pip install --upgrade pip
          pip install "nox==$NOX_VERSION" "uv==$UV_VERSION"
        env:
          NOX_VERSION: '2026.4.10'
          UV_VERSION: '0.11.26'

      - name: Install Test Requirements
        env:
          SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
        run: |
          nox --force-color -e tests-3 --install-only

      - name: Test
        env:
          SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
          SKIP_REQUIREMENTS_INSTALL: true
        run: |
          nox --force-color -e tests-3 -- -vv --instafail tests/

      - name: Create CodeCov Flags
        if: always()
        id: codecov-flags
        shell: bash
        env:
          CODECOV_RUNNER_OS: ${{ runner.os }}
          CODECOV_SALT_VERSION: ${{ matrix.salt-version }}
        run: |
          python - <<'PY'
          import os
          import sys

          runner_os = os.environ["CODECOV_RUNNER_OS"].replace("-latest", "")
          python_version = f"py{sys.version_info.major}{sys.version_info.minor}"
          salt_version = os.environ["CODECOV_SALT_VERSION"].replace("==", "_").replace(".", "_")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"flags={runner_os},{python_version},salt_{salt_version}\n")
          PY

      - name: Upload Project Code Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ steps.codecov-flags.outputs.flags }},project
          name: ${{ runner.os }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-project
          use_oidc: true
          version: v11.2.8

      - name: Upload Tests Code Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ steps.codecov-flags.outputs.flags }},tests
          name: ${{ runner.os }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.2.8

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtests-${{ runner.os }}-py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}

  Windows:
    name: Windows / Python ${{ matrix.python-version }} / Salt ${{ matrix.salt-version }}
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write  # Codecov uses GitHub OIDC instead of a repository token.

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {salt-version: "3006.27", python-version: "3.11"}
          - {salt-version: "3008.2", python-version: "3.14"}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nox
        run: |
          python -m pip install --upgrade pip
          pip install "nox==$env:NOX_VERSION" "uv==$env:UV_VERSION"
        env:
          NOX_VERSION: '2026.4.10'
          UV_VERSION: '0.11.26'

      - name: Install Test Requirements
        shell: bash
        env:
          SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
          # EXTRA_REQUIREMENTS_INSTALL: Cython
        run: |
          export PATH="/C/Program Files (x86)/Windows Kits/10/bin/10.0.18362.0/x64;$PATH"
          nox --force-color -e tests-3 --install-only

      - name: Test
        shell: bash
        env:
          SALT_REQUIREMENT: salt==${{ matrix.salt-version }}
          SKIP_REQUIREMENTS_INSTALL: true
        run: |
          export PATH="/C/Program Files (x86)/Windows Kits/10/bin/10.0.18362.0/x64;$PATH"
          nox --force-color -e tests-3 -- -vv --instafail tests/

      - name: Create CodeCov Flags
        if: always()
        id: codecov-flags
        shell: bash
        env:
          CODECOV_RUNNER_OS: ${{ runner.os }}
          CODECOV_SALT_VERSION: ${{ matrix.salt-version }}
        run: |
          python - <<'PY'
          import os
          import sys

          runner_os = os.environ["CODECOV_RUNNER_OS"].replace("-latest", "")
          python_version = f"py{sys.version_info.major}{sys.version_info.minor}"
          salt_version = os.environ["CODECOV_SALT_VERSION"].replace("==", "_").replace(".", "_")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"flags={runner_os},{python_version},salt_{salt_version}\n")
          PY

      - name: Upload Project Code Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: artifacts/coverage-project.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ steps.codecov-flags.outputs.flags }},project
          name: ${{ runner.os }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-project
          use_oidc: true
          version: v11.2.8

      - name: Upload Tests Code Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: artifacts/coverage-tests.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ steps.codecov-flags.outputs.flags }},tests
          name: ${{ runner.os }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}-tests
          use_oidc: true
          version: v11.2.8

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runtests-${{ runner.os }}-py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}.log
          path: artifacts/runtests-*.log

      - name: Upload Exit Status
        if: always()
        uses: ./.github/actions/upload-exitstatus
        with:
          name: ${{ github.job }}-Py${{ matrix.python-version }}-Salt${{ matrix.salt-version }}

  macOS:
    name: macOS / Python ${{ matrix.python-version }} / Salt ${{ matrix.salt-version }}
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: read
